    <rect x="548" y="322" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#CDCDCB"/>
    <text x="608" y="341" text-anchor="middle" fill="#919599" font-size="11" font-weight="700">SCHEDULED</text>
