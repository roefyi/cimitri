<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" fill="none">
  <!-- Clockwork + AlignUI foundations. Place on System. -->
  <rect width="960" height="420" rx="8" fill="#FFFFFF"/>
  <text x="40" y="48" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#E56515" letter-spacing="2">CIMITRI · SYSTEM</text>
  <text x="40" y="88" font-family="Manrope, Inter, sans-serif" font-size="28" font-weight="800" fill="#1A1A1A">Clockwork palette</text>
  <text x="40" y="114" font-family="Manrope, Inter, sans-serif" font-size="14" fill="#919599">AlignUI components. Primary #E56515. Body copy stays near-black.</text>

  <rect x="40" y="148" width="160" height="180" rx="12" fill="#E56515"/>
  <text x="56" y="308" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">#E56515</text>
  <text x="56" y="326" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#FFF4EB">Primary</text>

  <rect x="216" y="148" width="160" height="180" rx="12" fill="#FBA45C"/>
  <text x="232" y="308" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">#FBA45C</text>
  <text x="232" y="326" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#1A1A1A">Primary soft</text>

  <rect x="392" y="148" width="160" height="180" rx="12" fill="#F8F8F8" stroke="#CDCDCB"/>
  <text x="408" y="308" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">#F8F8F8</text>
  <text x="408" y="326" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#919599">Background</text>

  <rect x="568" y="148" width="160" height="180" rx="12" fill="#CDCDCB"/>
  <text x="584" y="308" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">#CDCDCB</text>
  <text x="584" y="326" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#1A1A1A">Border</text>

  <rect x="744" y="148" width="160" height="180" rx="12" fill="#919599"/>
  <text x="760" y="308" font-family="Manrope, Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">#919599</text>
  <text x="760" y="326" font-family="Manrope, Inter, sans-serif" font-size="12" fill="#F8F8F8">Muted</text>
