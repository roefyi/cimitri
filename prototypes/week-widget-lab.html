<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cimitri — week widget lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { display: flex; color: #1a1a1a; background: #eceff3; }
    button, select { font: inherit; cursor: pointer; }
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #dde3ea;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar .brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #21395a;
      font-family: Manrope, sans-serif;
    }
    .sidebar h1 { font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800; line-height: 1.2; }
    .sidebar label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b7380; }
    .sidebar select {
      width: 100%;
      padding: 10px 10px;
      border: 1px solid #cfd7e0;
      border-radius: 10px;
      background: #f7f9fb;
    }
    .sidebar .blurb { font-size: 13px; line-height: 1.45; color: #5c6570; }
    .stage { flex: 1; overflow: auto; padding: 28px; }
    .widget {
      max-width: 920px;
      margin: 0 auto;
      border-radius: 20px;
      padding: 22px;
      background: #fff;
      border: 1px solid #e2e8ee;
    }
    .hidden { display: none !important; }
    .status {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef1f4;
    }
    .status.en_route { background: #e4eefc; color: #1d4f91; }
    .status.on_site { background: #f8ecd8; color: #8a5a12; }
    .status.complete { background: #e4f3ea; color: #2f6f4e; }
    .status.scheduled { color: #5c6570; }

    /* 1 pills — option C + Clockwork */
    #w1 { font-family: Manrope, sans-serif; background: #f8f8f8; }
    #w1 .widget { background: #fff; border-color: #cdcdcb; }
    #w1 h2 { color: #1a1a1a; }
    #w1 .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 12px 0 16px; }
    #w1 .pill { border: 1px solid #cdcdcb; background: #fff; border-radius: 14px; padding: 10px 6px; text-align: center; color: #1a1a1a; }
    #w1 .pill.on { background: #e56515; color: #fff; border-color: #e56515; }
    #w1 .card { border: 1px solid #cdcdcb; border-radius: 14px; padding: 14px; margin-bottom: 8px; display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; background: #fff; }
    #w1 .bar { border-radius: 99px; }
    #w1 .bar.oss { background: #e56515; } #w1 .bar.vault { background: #919599; }
    #w1 .bar.pump { background: #fba45c; } #w1 .bar.grease { background: #cdcdcb; }
    #w1 .status { border: 1px solid #cdcdcb; background: #fff; color: #919599; }
    #w1 .status.en_route { background: #fff4eb; color: #1a1a1a; border-color: #fba45c; }
    #w1 .status.on_site { background: #e56515; color: #fff; border-color: #e56515; }
    #w1 .status.complete { background: #fff; color: #919599; }

    /* 2 columns */
    #w2 { font-family: "Source Sans 3", sans-serif; background: #eef6f3; }
    #w2 .widget { background: #f7fbf9; border-color: #cfe3db; }
    #w2 h2 { color: #1d4a3c; }
    #w2 .cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    #w2 .col { background: #fff; border: 1px solid #d5e8e0; border-radius: 12px; min-height: 220px; padding: 8px; }
    #w2 .col.on { box-shadow: 0 0 0 2px #2a7a62; }
    #w2 .col h3 { font-size: 11px; text-transform: uppercase; color: #5f7d72; }
    #w2 .chip { display: block; width: 100%; text-align: left; border: 0; background: #e6f3ec; border-radius: 8px; padding: 6px; margin-top: 6px; font-size: 12px; }
    #w2 .detail { margin-top: 14px; padding: 12px; background: #fff; border-radius: 12px; border: 1px solid #d5e8e0; font-size: 14px; }

    /* 3 hero */
    #w3 { font-family: Manrope, sans-serif; background: #f6f1ea; }
    #w3 .widget { background: #fffaf4; border-color: #eadccb; }
    #w3 .hero { background: #fff; border: 1px solid #eadccb; border-radius: 16px; padding: 18px; }
    #w3 .hero h3 { font-size: 13px; color: #8a6d4a; text-transform: uppercase; letter-spacing: .08em; }
    #w3 .row { width: 100%; text-align: left; border: 1px solid #eadccb; background: #fff; border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
    #w3 .row.open { background: #f3e7d6; }
    #w3 .job { padding: 8px 0; border-top: 1px solid #eadccb; font-size: 14px; }

    /* 4 stepper */
    #w4 { font-family: "IBM Plex Sans", sans-serif; background: #eef4fb; }
    #w4 .widget { background: #f7fafd; border-color: #c9dbf0; }
    #w4 .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    #w4 .filters button { border: 1px solid #c9dbf0; background: #fff; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    #w4 .filters button.on { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    #w4 .job { background: #fff; border: 1px solid #c9dbf0; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    #w4 .steps { display: flex; gap: 4px; margin-top: 10px; }
    #w4 .steps button { flex: 1; font-size: 10px; padding: 6px 4px; border-radius: 8px; border: 1px solid #d5e4f4; background: #f4f8fc; }
    #w4 .steps button.on { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    #w4 .steps button.done { background: #d6e8fb; }

    /* 5 trucks */
    #w5 { font-family: Manrope, sans-serif; background: #eef5ee; }
    #w5 .widget { background: #f6fbf6; border-color: #c9e0c9; }
    #w5 .strip { display: flex; gap: 6px; margin-bottom: 14px; }
    #w5 .strip button { flex: 1; border: 1px solid #c9e0c9; background: #fff; border-radius: 10px; padding: 8px 4px; font-size: 12px; }
    #w5 .strip button.on { background: #2f6f4e; color: #fff; border-color: #2f6f4e; }
    #w5 .truck { margin-bottom: 16px; }
    #w5 .truck h3 { font-size: 13px; color: #2f6f4e; margin-bottom: 6px; }
    #w5 .stop { background: #fff; border: 1px solid #c9e0c9; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }

    /* 6 phone */
    #w6 { font-family: Manrope, sans-serif; background: #f3f3f1; }
    #w6 .widget { max-width: 380px; background: #fffcf8; border-color: #e8ddd0; box-shadow: 0 20px 40px -28px #8a5a12; }
    #w6 .big { font-size: 56px; font-weight: 800; letter-spacing: -.04em; color: #1a1a1a; }
    #w6 .sub { color: #8a5a12; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
    #w6 .dots { display: flex; gap: 8px; margin: 14px 0 18px; }
    #w6 .dots button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #e8ddd0; background: #fff; font-size: 11px; font-weight: 700; }
    #w6 .dots button.on { background: #e25b16; color: #fff; border-color: #e25b16; }
    #w6 .swipe { background: #fff; border: 1px solid #e8ddd0; border-radius: 16px; padding: 16px; margin-bottom: 10px; }

    /* 7 load bars */
    #w7 { font-family: "IBM Plex Sans", sans-serif; background: #f3f0f7; }
    #w7 .widget { background: #faf8fd; border-color: #ddd4ea; }
    #w7 .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 140px; margin: 8px 0 16px; }
    #w7 .bars button { height: 100%; border: 0; background: transparent; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
    #w7 .fill { width: 100%; border-radius: 8px 8px 4px 4px; background: #8b7bb8; min-height: 8px; }
    #w7 .bars button.on .fill { background: #5b4a8a; }
    #w7 .list-item { background: #fff; border: 1px solid #ddd4ea; border-radius: 12px; padding: 12px; margin-bottom: 8px; }

    /* 8 queue */
    #w8 { font-family: "IBM Plex Sans", sans-serif; background: #ececec; }
    #w8 .widget { background: #fff; border-color: #ccc; }
    #w8 .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid #222; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    #w8 .seg button { border: 0; background: #fff; padding: 10px; font-weight: 700; }
    #w8 .seg button.on { background: #222; color: #fff; }
    #w8 .q { display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #e5e5e5; }
    #w8 .q .kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #888; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Cimitri</div>
    <h1>Week widget lab</h1>
    <label for="picker">Concept</label>
    <select id="picker" aria-label="Choose a week widget concept">
      <option value="1">1 · Day pills + list</option>
      <option value="2">2 · Seven columns</option>
      <option value="3">3 · Today hero</option>
      <option value="4">4 · Status path</option>
      <option value="5">5 · By truck</option>
      <option value="6">6 · Phone strip</option>
      <option value="7">7 · Load bars</option>
      <option value="8">8 · Now / Next / Later</option>
    </select>
    <p class="blurb" id="blurb"></p>
  </aside>
  <main class="stage">
    <section id="w1" class="theme"><div class="widget" id="m1"></div></section>
    <section id="w2" class="theme hidden"><div class="widget" id="m2"></div></section>
    <section id="w3" class="theme hidden"><div class="widget" id="m3"></div></section>
    <section id="w4" class="theme hidden"><div class="widget" id="m4"></div></section>
    <section id="w5" class="theme hidden"><div class="widget" id="m5"></div></section>
    <section id="w6" class="theme hidden"><div class="widget" id="m6"></div></section>
    <section id="w7" class="theme hidden"><div class="widget" id="m7"></div></section>
    <section id="w8" class="theme hidden"><div class="widget" id="m8"></div></section>
  </main>
  <script>
    const BLURBS = {
      1: "Option C with Clockwork: selected day is #E56515. Pick a day, then scan the list.",
      2: "Scan the whole week left to right. Click a chip for detail.",
      3: "Land on today. Open another day only if you need it.",
      4: "Today’s jobs as a status stepper. Tap to advance.",
      5: "Find your truck, then today’s stops.",
      6: "One-thumb phone: big date, tiny week, swipe-width cards.",
      7: "See which days are heavy, then open one.",
      8: "Work a queue: Now, Next, Later — not a calendar grid."
    };
    const STATUS = { scheduled: "Scheduled", en_route: "En route", on_site: "On site", complete: "Complete" };
    const STEPS = ["scheduled", "en_route", "on_site", "complete"];
    const JOBS = [
      { id: 1, date: "2026-08-24", type: "oss", title: "CEP-5 install — Lot 12 Oak Ridge", crew: "Ray + Marcus", truck: "T-14", status: "complete", time: "7:00" },
      { id: 2, date: "2026-08-24", type: "pump", title: "Pump-out — Henderson", crew: "Dee", truck: "Vac-2", status: "complete", time: "13:30" },
      { id: 3, date: "2026-08-25", type: "oss", title: "New tank — 441 Pine", crew: "Ray + Marcus", truck: "T-14", status: "on_site", time: "7:30" },
      { id: 4, date: "2026-08-25", type: "vault", title: "Vault set — Grace Memorial", crew: "Eli", truck: "Flat-1", status: "en_route", time: "10:00" },
      { id: 5, date: "2026-08-25", type: "grease", title: "Grease trap — County diner", crew: "Dee", truck: "Vac-2", status: "scheduled", time: "15:00" },
      { id: 6, date: "2026-08-26", type: "vault", title: "Vault — Hillside cemetery", crew: "Eli", truck: "Flat-1", status: "scheduled", time: "8:00" },
      { id: 7, date: "2026-08-26", type: "pump", title: "Return pump — Walker", crew: "Dee", truck: "Vac-2", status: "scheduled", time: "11:00" },
      { id: 8, date: "2026-08-27", type: "oss", title: "Repair — 90 County Rd 9", crew: "Ray + Marcus", truck: "T-14", status: "scheduled", time: "7:00" },
      { id: 9, date: "2026-08-28", type: "grease", title: "Car wash pit — Eastbay", crew: "Dee", truck: "Vac-2", status: "scheduled", time: "9:00" },
      { id: 10, date: "2026-08-28", type: "oss", title: "Install — new build Meadows", crew: "Ray + Marcus", truck: "T-14", status: "scheduled", time: "7:00" }
    ];
    const TODAY = new Date(2026, 7, 25);
    let selected = new Date(TODAY);
    let weekStart = startOfWeek(TODAY);
    let live = JOBS.map(j => ({ ...j }));
    let queueSeg = "now";
    let openDay = iso(TODAY);
    let detail = null;

    function iso(d) {
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }
    function startOfWeek(d) {
      const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x;
    }
    function weekDays() {
      return Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(weekStart.getDate()+i); return d; });
    }
    function jobsOn(d) { return live.filter(j => j.date === iso(d)); }
    function wd(d) { return d.toLocaleDateString("en-US", { weekday: "short" }); }

    function render1() {
      const days = weekDays();
      const jobs = jobsOn(selected);
      document.getElementById("m1").innerHTML =
        `<h2>This week</h2>
         <div class="week">${days.map(d => `<button class="pill ${iso(d)===iso(selected)?"on":""}" data-iso="${iso(d)}"><div>${wd(d)}</div><strong>${d.getDate()}</strong></button>`).join("")}</div>
         ${jobs.map(j => `<article class="card"><div class="bar ${j.type}"></div><div><strong>${j.title}</strong><div style="color:#919599;font-size:13px;margin-top:2px">${j.time} · ${j.crew} · ${j.truck}</div></div><span class="status ${j.status}">${STATUS[j.status]}</span></article>`).join("") || "<p>Nothing this day.</p>"}`;
      document.querySelectorAll("#m1 .pill").forEach(b => b.onclick = () => { selected = new Date(b.dataset.iso+"T12:00:00"); renderActive(); });
    }

    function render2() {
      const days = weekDays();
      document.getElementById("m2").innerHTML =
        `<h2>Week board</h2><p style="color:#5f7d72;margin:4px 0 12px">Scan left to right. Click a job.</p>
         <div class="cols">${days.map(d => {
           const on = iso(d)===iso(selected) ? "on" : "";
           return `<div class="col ${on}"><h3>${wd(d)} ${d.getDate()}</h3>${jobsOn(d).map(j => `<button class="chip" data-id="${j.id}">${j.time} ${j.title.split("—")[0]}</button>`).join("")}</div>`;
         }).join("")}</div>
         <div class="detail">${detail ? `<strong>${detail.title}</strong><div>${detail.time} · ${detail.crew} · ${detail.truck}</div>` : "Select a chip."}</div>`;
      document.querySelectorAll("#m2 .chip").forEach(b => b.onclick = () => {
        detail = live.find(j => j.id === +b.dataset.id);
        selected = new Date(detail.date+"T12:00:00");
        renderActive();
      });
    }

    function render3() {
      const days = weekDays();
      const todayIso = iso(TODAY);
      const heroJobs = jobsOn(TODAY);
      document.getElementById("m3").innerHTML =
        `<div class="hero"><h3>Today</h3><h2 style="font-size:22px;margin:4px 0 10px">Tuesday, Aug 25</h2>
          ${heroJobs.map(j => `<div class="job">${j.time} · ${j.title}<span class="status ${j.status}" style="float:right">${STATUS[j.status]}</span></div>`).join("")}
         </div>
         ${days.filter(d => iso(d)!==todayIso).map(d => {
           const open = openDay === iso(d);
           return `<button class="row ${open?"open":""}" data-iso="${iso(d)}">${wd(d)} ${d.getDate()} · ${jobsOn(d).length} jobs</button>
             ${open ? jobsOn(d).map(j => `<div class="job">${j.time} · ${j.title}</div>`).join("") : ""}`;
         }).join("")}`;
      document.querySelectorAll("#m3 .row").forEach(b => b.onclick = () => { openDay = openDay === b.dataset.iso ? todayIso : b.dataset.iso; renderActive(); });
    }

    function render4() {
      const days = weekDays();
      const jobs = jobsOn(selected);
      document.getElementById("m4").innerHTML =
        `<h2>Advance the job</h2>
         <div class="filters">${days.map(d => `<button class="${iso(d)===iso(selected)?"on":""}" data-iso="${iso(d)}">${wd(d)} ${d.getDate()}</button>`).join("")}</div>
         ${jobs.map(j => `<div class="job"><strong>${j.title}</strong><div style="color:#5b6b7c;font-size:13px;margin-top:4px">${j.time} · ${j.truck}</div>
           <div class="steps">${STEPS.map((s,i) => {
             const idx = STEPS.indexOf(j.status);
             const cls = s===j.status ? "on" : (i < idx ? "done" : "");
             return `<button class="${cls}" data-id="${j.id}" data-s="${s}">${STATUS[s]}</button>`;
           }).join("")}</div></div>`).join("") || "<p>No jobs.</p>"}`;
      document.querySelectorAll("#m4 .filters button").forEach(b => b.onclick = () => { selected = new Date(b.dataset.iso+"T12:00:00"); renderActive(); });
      document.querySelectorAll("#m4 .steps button").forEach(b => b.onclick = () => {
        const j = live.find(x => x.id === +b.dataset.id); j.status = b.dataset.s; renderActive();
      });
    }

    function render5() {
      const days = weekDays();
      const jobs = jobsOn(selected);
      const trucks = [...new Set(jobs.map(j => j.truck))];
      document.getElementById("m5").innerHTML =
        `<h2>By truck</h2>
         <div class="strip">${days.map(d => `<button class="${iso(d)===iso(selected)?"on":""}" data-iso="${iso(d)}">${wd(d)}<br>${d.getDate()}</button>`).join("")}</div>
         ${trucks.length ? trucks.map(t => `<div class="truck"><h3>${t}</h3>${jobs.filter(j=>j.truck===t).map(j => `<div class="stop"><span>${j.time} · ${j.title}</span><span class="status ${j.status}">${STATUS[j.status]}</span></div>`).join("")}</div>`).join("") : "<p>No jobs.</p>"}`;
      document.querySelectorAll("#m5 .strip button").forEach(b => b.onclick = () => { selected = new Date(b.dataset.iso+"T12:00:00"); renderActive(); });
    }

    function render6() {
      const days = weekDays();
      const jobs = jobsOn(selected);
      document.getElementById("m6").innerHTML =
        `<div class="sub">${selected.toLocaleDateString("en-US",{weekday:"long"})}</div>
         <div class="big">${selected.getDate()}</div>
         <div class="dots">${days.map(d => `<button class="${iso(d)===iso(selected)?"on":""}" data-iso="${iso(d)}">${d.getDate()}</button>`).join("")}</div>
         ${jobs.map(j => `<article class="swipe"><strong>${j.title}</strong><p style="color:#6a6258;margin-top:6px">${j.time} · ${j.crew} · ${j.truck}</p><span class="status ${j.status}">${STATUS[j.status]}</span></article>`).join("") || "<p>Clear day.</p>"}`;
      document.querySelectorAll("#m6 .dots button").forEach(b => b.onclick = () => { selected = new Date(b.dataset.iso+"T12:00:00"); renderActive(); });
    }

    function render7() {
      const days = weekDays();
      const max = Math.max(1, ...days.map(d => jobsOn(d).length));
      const jobs = jobsOn(selected);
      document.getElementById("m7").innerHTML =
        `<h2>Week load</h2>
         <div class="bars">${days.map(d => {
           const n = jobsOn(d).length;
           const h = 16 + (n/max)*100;
           return `<button data-iso="${iso(d)}"><span class="fill" style="height:${h}px"></span><span>${wd(d)}</span></button>`;
         }).join("")}</div>
         <p style="margin-bottom:10px;color:#5b4a8a;font-weight:600">${selected.toLocaleDateString("en-US",{weekday:"long", month:"short", day:"numeric"})}</p>
         ${jobs.map(j => `<div class="list-item"><strong>${j.title}</strong><div style="color:#6b6280;font-size:13px">${j.time} · ${j.truck} · ${STATUS[j.status]}</div></div>`).join("") || "<p>Quiet day.</p>"}`;
      document.querySelectorAll("#w7 .bars button").forEach(b => {
        if (b.dataset.iso === iso(selected)) b.classList.add("on");
        b.onclick = () => { selected = new Date(b.dataset.iso+"T12:00:00"); renderActive(); };
      });
    }

    function render8() {
      const todayI = iso(TODAY);
      const inWeek = live.filter(j => j.date >= iso(weekDays()[0]) && j.date <= iso(weekDays()[6]));
      const now = inWeek.filter(j => j.date === todayI && (j.status === "on_site" || j.status === "en_route"));
      const next = inWeek.filter(j => j.date === todayI && j.status === "scheduled");
      const later = inWeek.filter(j => j.date > todayI);
      const map = { now, next, later };
      const jobs = map[queueSeg];
      document.getElementById("m8").innerHTML =
        `<h2>Work the queue</h2>
         <div class="seg">
           <button class="${queueSeg==="now"?"on":""}" data-s="now">Now ${now.length}</button>
           <button class="${queueSeg==="next"?"on":""}" data-s="next">Next ${next.length}</button>
           <button class="${queueSeg==="later"?"on":""}" data-s="later">Later ${later.length}</button>
         </div>
         ${jobs.map(j => `<div class="q"><div class="kicker">${j.date===todayI?"Today":j.date.slice(5)} ${j.time}</div><div><strong>${j.title}</strong><div style="color:#666;font-size:13px">${j.crew} · ${j.truck}</div></div><span class="status ${j.status}">${STATUS[j.status]}</span></div>`).join("") || "<p>Queue empty.</p>"}`;
      document.querySelectorAll("#m8 .seg button").forEach(b => b.onclick = () => { queueSeg = b.dataset.s; renderActive(); });
    }

    const renders = { 1: render1, 2: render2, 3: render3, 4: render4, 5: render5, 6: render6, 7: render7, 8: render8 };

    function renderActive() {
      const id = document.getElementById("picker").value;
      document.getElementById("blurb").textContent = BLURBS[id];
      document.querySelectorAll(".theme").forEach(s => s.classList.add("hidden"));
      document.getElementById("w"+id).classList.remove("hidden");
      renders[id]();
    }

    document.getElementById("picker").addEventListener("change", renderActive);
    renderActive();
  </script>
</body>
</html>
